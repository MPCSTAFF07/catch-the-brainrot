  <div class="trade-compose">
    <h2>交換に出す</h2>
    <form action="{{ url_for('trade.post') }}" method="post" enctype="multipart/form-data" class="form" id="trade-post-form">
      <input type="hidden" name="csrf" value="{{ session['csrf'] }}">
      <label>カテゴリ
        <select name="category" required>
          {% for id, label in categories.items() %}<option value="{{ id }}">{{ label }}</option>{% endfor %}
        </select>
      </label>
      <div class="fields">
        <label>出すもの<input name="offered" maxlength="100" required></label>
        <label>欲しいもの<input name="wanted" maxlength="100" required></label>
      </div>
      <label>交換条件（任意）<textarea name="note" rows="4" maxlength="600"></textarea></label>
      <label>写真（任意）
        <input type="file" name="photo" accept="image/jpeg,image/png,image/webp" data-photo-limit="{{ photo_limit }}">
      </label>
      <p class="hint" id="trade-photo-status" role="status">JPEG・PNG・WebPを1枚添付できます。</p>
      <button type="submit">募集を投稿</button>
    </form>
  </div>
