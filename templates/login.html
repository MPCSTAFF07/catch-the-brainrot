{% extends "base.html" %}
{% block title %}Discord Login{% endblock %}
{% block content %}
  <div class="login-card">
    <div class="login-accent" lang="en">
      <p class="login-game-title"><span>Catch The</span> <strong>Brainrot</strong></p>
    </div>
    <section class="login-content" aria-labelledby="login-title">
      <h1 id="login-title" lang="en">Discord Login</h1>
      {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
      <a class="login-action" href="{{ url_for('discord_login') }}" lang="en">Login</a>
    </section>
  </div>
{% endblock %}
